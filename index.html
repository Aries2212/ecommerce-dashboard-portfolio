<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encasa XO | Business Intelligence Dashboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #121212;
            color: #ffffff;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .header .badge {
            background-color: #209aa8; 
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .content h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .content p {
            color: #666;
            margin-bottom: 35px;
            max-width: 500px;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .btn {
            background-color: #209aa8;
            color: white;
            padding: 15px 35px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(32, 154, 168, 0.3);
            transition: background-color 0.3s, transform 0.2s;
        }
        .btn:hover {
            background-color: #177b87;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Encasa XO Monthly Business Intelligence Dashboard</h1>
        <span class="badge">Interactive Portfolio</span>
    </div>
    
    <div class="content">
        <h2>Explore the Data</h2>
        <p>Dive into the interactive Business Intelligence Dashboard to view dynamic revenue metrics, order trends, and payment analysis.</p>
        
        <!-- This button links directly to your published Google Sheet in a new tab -->
        <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vRG3UF-_aWEgsAcU8pA43-pjJ6id_gH5C8cmV8cr0d84UGf_mTn3CBmGbFS5EOoZ-GuuAG3cGqmCqYc/pubhtml?gid=1875445097&single=true" target="_blank" class="btn">
            View Interactive Dashboard 📊
        </a>
    </div>
</body>
</html>
