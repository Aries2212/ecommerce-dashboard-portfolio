<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encasa XO | Business Intelligence Dashboard</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            overflow: hidden; 
        }
        .header {
            background-color: #121212;
            color: #ffffff;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .header .badge {
            background-color: #209aa8; 
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .iframe-container {
            width: 100%;
            height: calc(100vh - 55px); 
            border: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Encasa XO Monthly Business Intelligence Dashboard</h1>
        <span class="badge">Interactive Portfolio</span>
    </div>
    
    <div class="iframe-container">
        <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRG3UF-_aWEgsAcU8pA43-pjJ6id_gH5C8cmV8cr0d84UGf_mTn3CBmGbFS5EOoZ-GuuAG3cGqmCqYc/pubhtml?gid=1875445097&amp;single=true&amp;widget=true&amp;headers=false" frameborder="0"></iframe>

</html>
